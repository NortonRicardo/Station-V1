; Station - ESP32 DevKitC 38 pinos (ESP32-WROOM-32U, antena externa U.FL)
[platformio]
; "pio run -t upload" grava só pelo USB; pelo Wi-Fi use -e ota
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    mikalhart/TinyGPSPlus@^1.1.0
extra_scripts =
    pre:scripts/env_flags.py
    pre:scripts/build_page.py

; Gravação pelo Wi-Fi (depois da 1ª gravação por USB): pio run -e ota -t upload
; A senha vem do .env (STATION_OTA_PASS).
[env:ota]
extends = env:esp32dev
upload_protocol = espota
; cada estação tem o nome pelo final do MAC (aparece na página, em Estação → Nome na rede)
; outra estação: pio run -e ota -t upload --upload-port station-xxxx.local
upload_port = station-5cc4.local
